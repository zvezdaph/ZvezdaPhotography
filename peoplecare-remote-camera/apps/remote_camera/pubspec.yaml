name: remote_camera
description: "PeopleCare Remote Camera - turns an Android phone into a remote production camera (SRT to Cloudflare Stream, remote control via Cloudflare Workers)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # Secure storage (Android Keystore) for the device token and ingest credentials.
  flutter_secure_storage: ^11.2.0
  # Non secret settings (resolution, fps, bitrate, orientation...).
  shared_preferences: ^2.5.5
  # HTTPS calls for pairing.
  http: ^1.6.0
  # QR code generation for pairing (rendered with a CustomPainter).
  qr: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
